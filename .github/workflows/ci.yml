# Lint, MicroPython syntax check and every test (host and simulator) on
# each pull request and each push to main. The same commands as the
# README's "Task | Command" table.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # vendor/: Pimoroni's ruff rules and the simulator's firmware

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4  # the simulator tests run under Node
        with:
          node-version: "20"

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Lint (Pimoroni's ruff rules, ruff.toml)
        run: ruff check --output-format github .

      - name: MicroPython syntax
        run: find apps/dice_roller -name '*.py' -print0 | xargs -0 -n1 python -m mpy_cross -o /dev/null

      - name: Tests (host and simulator)
        run: pytest
